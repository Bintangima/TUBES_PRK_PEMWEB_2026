name: Validasi PR Tugas Besar Pemweb

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

jobs:
  validate-pr:
    name: Cek Isolasi Folder & Sintaks Kode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 2. Cek Isolasi Folder Kelompok & File Terlarang
        run: |
          echo "Mengambil daftar file yang diubah pada Pull Request ini..."
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "❌ Tidak ada perubahan file yang terdeteksi."
            exit 1
          fi

          echo "File yang diubah:"
          echo "$CHANGED_FILES"
          echo "----------------------------------------"

          # 1. Pastikan hanya menyentuh folder kelompok/kelompok_XX/
          INVALID_PATHS=$(echo "$CHANGED_FILES" | grep -vE '^kelompok/kelompok_[0-9]{2}/' || true)
          if [ -n "$INVALID_PATHS" ]; then
            echo "❌ DITOLAK: Anda mengubah file di luar folder kelompok yang diizinkan!"
            echo "File yang melanggar aturan:"
            echo "$INVALID_PATHS"
            echo ""
            echo "Pastikan Anda hanya menambah/mengubah file di dalam folder 'kelompok/kelompok_XX/' (contoh: kelompok/kelompok_01/)."
            exit 1
          fi

          # 2. Pastikan hanya 1 folder kelompok yang diubah dalam 1 PR (mencegah merusak kelompok lain)
          GROUPS_TOUCHED=$(echo "$CHANGED_FILES" | cut -d'/' -f2 | sort -u)
          GROUP_COUNT=$(echo "$GROUPS_TOUCHED" | wc -l)

          if [ "$GROUP_COUNT" -gt 1 ]; then
            echo "❌ DITOLAK: Pull Request ini mengubah lebih dari satu folder kelompok sekaligus!"
            echo "Folder kelompok yang tersentuh:"
            echo "$GROUPS_TOUCHED"
            exit 1
          fi

          echo "✅ Lolos uji isolasi: Perubahan hanya dilakukan pada folder kelompok/$GROUPS_TOUCHED/"

      - name: 3. Cek Ukuran File (Maksimal 5MB per file)
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD)
          MAX_SIZE=$((5 * 1024 * 1024)) # 5 MB dalam bytes
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              FILE_SIZE=$(stat -c%s "$file")
              if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
                echo "❌ DITOLAK: File '$file' berukuran terlalu besar ($(($FILE_SIZE / 1024 / 1024)) MB). Maksimal ukuran file adalah 5 MB."
                exit 1
              fi
            fi
          done
          echo "✅ Semua ukuran file sesuai ketentuan."

      - name: 4. Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 5. Cek Sintaks PHP Native (PHP Lint)
        run: |
          CHANGED_PHP_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD | grep -E '\.php$' || true)
          
          if [ -z "$CHANGED_PHP_FILES" ]; then
            echo "ℹ️ Tidak ada file PHP yang diubah/ditambahkan. Melewati pengecekan sintaks PHP."
            exit 0
          fi

          echo "Memeriksa sintaks pada file PHP berikut:"
          echo "$CHANGED_PHP_FILES"
          echo "----------------------------------------"

          ERROR_FOUND=0
          for file in $CHANGED_PHP_FILES; do
            php -l "$file" || ERROR_FOUND=1
          done

          if [ "$ERROR_FOUND" -ne 0 ]; then
            echo "❌ DITOLAK: Ditemukan syntax error pada kode PHP Anda! Silakan perbaiki sebelum melakukan Merge."
            exit 1
          fi

          echo "✅ Seluruh file PHP bebas dari syntax error."

      - name: 6. Auto-Merge PR Jika Lolos Semua Validasi
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "✅ Seluruh validasi lolos! Melakukan Auto-Merge Pull Request #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --merge --repo ${{ github.repository }}